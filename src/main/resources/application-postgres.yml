# Docker 導入後に使うプロファイル:
#   docker compose up -d
#   mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/worklog
    username: worklog
    # パスワードは application-local.yml（Git 管理外）に置く。
    # 資格情報をリポジトリへ入れない方針は暗号鍵と同じ
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # スキーマは Flyway が作る。ここで update にすると application.yml の validate を
      # 上書きしてしまい、エンティティとマイグレーションの乖離に気付けなくなる
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
