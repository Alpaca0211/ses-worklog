spring:
  application:
    name: ses-worklog
  profiles:
    # 既定は PostgreSQL。用意できない場合は h2 プロファイルで起動する
    #   mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
    active: postgres
    # 暗号鍵などマシン固有の設定は application-local.yml に置く（Git 管理外）
    include: local

  jpa:
    # 画面描画中に遅延ロードさせない。N+1 と、描画時の予期しない SQL を防ぐ
    open-in-view: false
    properties:
      hibernate.format_sql: true
    hibernate:
      # スキーマは Flyway が作る。Hibernate には検証だけさせ、変更はさせない。
      # ずれていれば起動時に落ちるので、エンティティと SQL の乖離に気付ける
      ddl-auto: validate

  flyway:
    enabled: true
    # 既にテーブルがあるデータベースは V1 を適用済みとして記録し、V2 以降だけを流す。
    # 新規のデータベースでは V1 から順に実行される
    baseline-on-migrate: true
    baseline-version: 1

  thymeleaf:
    cache: false

server:
  port: 8080
  # 生ログを保持するため、既定ではループバックのみに公開する。
  # スマホから入力したい場合のみ 0.0.0.0 に変更すること（README の注意事項を必ず読むこと）
  address: 127.0.0.1

worklog:
  # 作業内容欄の書式。週報システムの仕様ではなく利用者独自の記法のため設定にしている
  format:
    daily-header: "■やったこと"
    project-prefix: "▶ "
    item-prefix: "・"

  llm:
    enabled: true
    # これ以下の長さの入力は抽象化しない。
    # 情報量が少ないほど LLM は書かれていない内容を補うため
    min-abstract-length: 60
    # OpenAI 互換エンドポイント（Ollama / vLLM / LM Studio）
    base-url: http://localhost:11434/v1
    api-key: local
    # `ollama list` で表示される実際のタグに合わせること
    model: qwen3.5:9b
    temperature: 0.2
    timeout-seconds: 120
    # 思考モードの抑制。思考型モデルは既定で数千トークンを思考に費やし、
    # 本文が出る前に文脈上限に達する（実測: 未指定 90 秒・本文空 / none 指定 1 秒）。
    # reasoning_effort に対応しないサーバでは空文字にすると送信しない。
    reasoning-effort: none

logging:
  level:
    com.example.worklog: INFO
