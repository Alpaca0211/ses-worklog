# Docker 導入後に使う。MVP は H2 ファイルDB で動くため必須ではない。
#   docker compose up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
services:
  db:
    # 週報生成フェーズでベクトル検索を使うため、最初から pgvector 入りを指定する
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: worklog
      POSTGRES_USER: worklog
      POSTGRES_PASSWORD: worklog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    # GPU を使う場合（NVIDIA Container Toolkit が必要）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama:
